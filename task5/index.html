<!DOCTYPE html>
<html>
<head>
    <title>Events Example</title>
</head>
<body>

    <h2 id="result">Result will appear here</h2>

    <button id="clickBtn">Click Me</button>

    <br><br>

    <input type="text" id="textInput" placeholder="Type something">

    <br><br>

    <button id="hoverBtn">Move mouse over me</button>

    <br><br>

    <form id="myForm">
        <input type="text" id="nameInput" placeholder="Enter your name">
        <button type="submit">Submit Form</button>
    </form>


    <script>

        let result = document.getElementById("result");

        let clickBtn = document.getElementById("clickBtn");
        let textInput = document.getElementById("textInput");
        let hoverBtn = document.getElementById("hoverBtn");
        let myForm = document.getElementById("myForm");
        let nameInput = document.getElementById("nameInput");


        // 1- click
        clickBtn.addEventListener("click", function () {

            result.innerHTML = "Button was clicked";

        });


        // 2- input
        textInput.addEventListener("input", function () {

            result.innerHTML = "You typed: " + textInput.value;

        });


        // 3- mouseover
        hoverBtn.addEventListener("mouseover", function () {

            result.innerHTML = "Mouse is over the button";

        });


        // 4- keydown
        textInput.addEventListener("keydown", function (event) {

            console.log("You pressed: " + event.key);

        });


        // 5- submit
        myForm.addEventListener("submit", function (event) {

            event.preventDefault();

            result.innerHTML = "Welcome " + nameInput.value;

        });

    </script>

</body>
</html>
